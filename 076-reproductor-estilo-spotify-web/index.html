<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Estilo Spotify</title>
  <meta name="description" content="Barra de progreso funcional, portada giratoria y letras sincronizadas: "Nuestra Canción". · Plantilla dedicatoria interactiva">
  <meta name="theme-color" content="#14101c">
  <!-- Open Graph: vista previa elegante al compartir por WhatsApp/redes -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Reproductor Estilo Spotify · Una dedicatoria para ti">
  <meta property="og:description" content="Barra de progreso funcional, portada giratoria y letras sincronizadas: "Nuestra Canción".">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Caveat:wght@500;700&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="player" id="player">
  <div class="main">
    <div class="cover">🎧</div>
    <div class="meta">
      <div class="label">Playlist · Nuestras sesiones</div>
      <h1>Nuestra Canción</h1>
      <p>Los Dos (feat. La Risa)</p>
      <div class="hearts" id="like">🤍</div>
    </div>
  </div>
  <div class="lyrics" id="lyrics"></div>
  <div class="controls">
    <div class="buttons">
      <button id="shuffle">🔀</button>
      <button id="prev">⏮</button>
      <button class="play" id="play">▶</button>
      <button id="next">⏭</button>
      <button id="repeat">🔁</button>
    </div>
    <div class="progress">
      <span id="cur">0:00</span>
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <span id="dur">3:45</span>
    </div>
  </div>
</div>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
  <script src="dedic.js"></script>
  <script src="script.js"></script>
</body>
</html>
