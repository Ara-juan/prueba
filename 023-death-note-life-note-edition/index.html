<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Death Note (Life Note Edition)</title>
  <meta name="description" content="Escribe un nombre en el libro gótico y recibe un certificado con las razones por las que esa persona es especial. · Plantilla dedicatoria interactiva">
  <meta name="theme-color" content="#14101c">
  <!-- Open Graph: vista previa elegante al compartir por WhatsApp/redes -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Death Note (Life Note Edition) · Una dedicatoria para ti">
  <meta property="og:description" content="Escribe un nombre en el libro gótico y recibe un certificado con las razones por las que esa persona es especial.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Caveat:wght@500;700&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="book">
  <h1>Life Note</h1>
  <p class="sub">Escribe un nombre… y el destino revelará por qué esa persona ilumina el mundo.</p>
  <label for="who">Nombre del ser querido</label>
  <div class="row">
    <input id="who" placeholder="Ej.: Mi persona favorita" maxlength="40" autocomplete="off">
    <button class="write" id="write">Escribir</button>
  </div>
</div>
<article class="cert" id="cert" aria-live="polite">
  <h2>Certificado oficial de maravillosidad</h2>
  <div>Se hace constar que</div>
  <div class="name" id="certName">—</div>
  <ul id="reasons"></ul>
  <div>…y por tanto, queda oficialmente declarada persona extraordinaria por el resto de sus días.</div>
  <div class="seal">SELLO OFICIAL DE CARIÑO</div>
</article>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
  <script src="dedic.js"></script>
  <script src="script.js"></script>
</body>
</html>
