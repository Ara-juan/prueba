<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitral de Catedral</title>
  <meta name="description" content="Ventanal de colores que, al recibir la luz, proyecta sombras multicolores y frases sobre el suelo. · Plantilla dedicatoria interactiva">
  <meta name="theme-color" content="#14101c">
  <!-- Open Graph: vista previa elegante al compartir por WhatsApp/redes -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vitral de Catedral · Una dedicatoria para ti">
  <meta property="og:description" content="Ventanal de colores que, al recibir la luz, proyecta sombras multicolores y frases sobre el suelo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Caveat:wght@500;700&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<span class="hint">Modo: penumbra</span>
<button class="sun-btn" id="sunBtn">☀️ Dejar entrar el sol</button>
<div class="window-zone">
  <svg id="vitrail" viewBox="0 0 200 260" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">
    <!-- Marco de piedra -->
    <rect x="0" y="0" width="200" height="260" fill="none" stroke="#3a352c" stroke-width="10"/>
    <!-- Rosetón superior -->
    <circle cx="100" cy="52" r="34" fill="#c94a4a" stroke="#3a352c" stroke-width="5"/>
    <circle cx="100" cy="52" r="20" fill="#e8c84a" stroke="#3a352c" stroke-width="4"/>
    <circle cx="100" cy="52" r="8" fill="#4a8ac9"/>
    <!-- Partes inferiores -->
    <path d="M20,100 L20,240 L60,240 L60,110 L100,60 L140,110 L140,240 L180,240 L180,100 L100,20 Z" fill="#3a6ac9" stroke="#3a352c" stroke-width="5" fill-opacity=".9"/>
    <path d="M60,110 L100,60 L140,110 L140,240 L60,240 Z" fill="#c94a8a" fill-opacity=".85" stroke="#3a352c" stroke-width="4"/>
    <path d="M20,170 L60,170 M140,170 L180,170 M60,200 L140,200" stroke="#3a352c" stroke-width="5"/>
    <circle cx="40" cy="205" r="12" fill="#4ac98a" stroke="#3a352c" stroke-width="3"/>
    <circle cx="160" cy="205" r="12" fill="#c9d84a" stroke="#3a352c" stroke-width="3"/>
  </svg>
</div>
<div class="floor">
  <div class="projection" id="projection">
    <svg viewBox="0 0 200 260" preserveAspectRatio="none">
      <path d="M20,100 L20,240 L60,240 L60,110 L100,60 L140,110 L140,240 L180,240 L180,100 L100,20 Z" fill="#c94a4a" opacity=".5"/>
      <path d="M60,110 L100,60 L140,110 L140,240 L60,240 Z" fill="#4a8ac9" opacity=".5"/>
      <circle cx="100" cy="52" r="34" fill="#e8c84a" opacity=".5"/>
    </svg>
  </div>
</div>
<div class="blessing" id="blessing">"La luz pasa por el color y se vuelve más hermosa. Tú haces lo mismo con los días." ✦</div>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
  <script src="dedic.js"></script>
  <script src="script.js"></script>
</body>
</html>
