<head>

<body>
<div class="scene">
  <div class="card3d" id="card">

    <div class="card-content">
      <div class="cc-top">
        <span class="brand">CORAZÓN ♥ ONE</span>

      </div>
      <div class="cc-num">1430 0214 •••• 3600</div>
      <div class="cc-bottom">
        <div><b>Titular</b><span id="holder">PERSONA FAVORITA</span></div>
        <div><b>Válido</b><span>SIEMPRE</span></div>
        <span class="cc-vip">VIP ∞</span>
      </div>
    </div>
    <div class="glare"></div>
  </div>
</div>
<p class="hint">Inclina el cursor sobre la tarjeta para ver el holograma ✨ (doble clic: cambia el nombre)</p>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
