<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Estilo Pokédex</title>
  <meta name="description" content="Ficha interactiva tipo Pokédex: "stats", habilidades especiales y anotaciones del ser querido. · Plantilla dedicatoria interactiva">
  <meta name="theme-color" content="#14101c">
  <!-- Open Graph: vista previa elegante al compartir por WhatsApp/redes -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Carta Estilo Pokédex · Una dedicatoria para ti">
  <meta property="og:description" content="Ficha interactiva tipo Pokédex: "stats", habilidades especiales y anotaciones del ser querido.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Caveat:wght@500;700&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="dex">
  <div class="top"><div class="lens"></div><div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div></div>
  <div class="layout">
    <div class="screen">
      <div class="no" id="dexNo">Nº 001</div>
      <h2 id="dexName">—</h2>
      <div class="sprite" id="dexSprite">❤️</div>
      <div class="controls" id="dexButtons"></div>
    </div>
    <div class="data" id="dexData">Encendiendo…</div>
  </div>
  <p class="hint">Usa los botones para navegar por la ficha</p>
</div>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
  <script src="dedic.js"></script>
  <script src="script.js"></script>
</body>
</html>
