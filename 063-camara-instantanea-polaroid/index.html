<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Pulsa el botón: la cámara imprime una foto que sale revelándose poco a poco… con tu sonrisa. · Plantilla dedicatoria interactiva">

<body>
<div class="camera" id="camera" role="button" tabindex="0" aria-label="Disparar la cámara">

  <div class="lens"></div>

  <div class="shutter">DISPARAR</div>

</div>
<div class="photos" id="photos"></div>
<p class="hint">Haz clic en la cámara para imprimir un recuerdo 📸</p>
