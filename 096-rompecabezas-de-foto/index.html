<body>
<header>
  <h1>🧩 Reconstruye el recuerdo</h1>

</header>
<div class="board-wrap">
  <div class="board" id="board"></div>
  <div class="tray" id="tray"><span class="tray-label">Piezas sueltas</span></div>
</div>
<div class="win" id="win">
  <div class="card">
    <div class="big">🌅</div>
    <h2>¡Recuerdo reconstruido!</h2>
    <p>Cada pieza era un instante: los mejores rompecabezas son los que armamos juntos. Este era el amanecer que nos sorprendió despiertos.</p>
  </div>
</div>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
