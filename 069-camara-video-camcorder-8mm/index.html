<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camcorder 8mm</title>
  <meta name="description" content="Vista de grabadora con REC parpadeante, batería que baja, fecha retro y filtro VHS auténtico. · Plantilla dedicatoria interactiva">
  <meta name="theme-color" content="#14101c">
  <!-- Open Graph: vista previa elegante al compartir por WhatsApp/redes -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Camcorder 8mm · Una dedicatoria para ti">
  <meta property="og:description" content="Vista de grabadora con REC parpadeante, batería que baja, fecha retro y filtro VHS auténtico.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Caveat:wght@500;700&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="viewfinder">
  <div class="scene-vhs">
    <div class="sun"></div>
    <div class="sea"></div>
    <div class="quote">"Atardecer grabado para siempre: el que se atardece contigo."</div>
  </div>
  <div class="vhs-noise"></div>
  <div class="vhs-lines"></div>
  <div class="vhs-head"></div>
  <div class="hud">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="rec" id="rec"><i></i>REC</div>
    <div class="battery" id="battery">BAT <span class="case"><span class="level" id="batLevel"></span></span></div>
    <div class="timecode" id="timecode">00:00:00:00</div>
    <div class="date-stamp" id="dateStamp">JUL.14 1998 PM 7:42</div>
  </div>
</div>
<div class="controls">
  <button id="pauseBtn">❚❚ PAUSA</button>
  <button id="dateBtn">📅 FECHA</button>
  <button class="danger" id="stopBtn">■ DETENER</button>
</div>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
  <script src="dedic.js"></script>
  <script src="script.js"></script>
</body>
</html>
