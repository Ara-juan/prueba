<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa del Tesoro Antiguo</title>
  <meta name="description" content="Pergamino con X que revela ubicaciones especiales e historias al tocar cada punto. · Plantilla dedicatoria interactiva">
  <meta name="theme-color" content="#14101c">
  <!-- Open Graph: vista previa elegante al compartir por WhatsApp/redes -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mapa del Tesoro Antiguo · Una dedicatoria para ti">
  <meta property="og:description" content="Pergamino con X que revela ubicaciones especiales e historias al tocar cada punto.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="map-wrap">
  <div class="map" id="map">
    <div class="map-title">✦ Mapa hacia el tesoro más valioso ✦</div>
    <div class="compass">🧭<b>N</b></div>
  </div>
</div>
<div class="lens" id="lens"></div>
<div class="progress" id="progress">Tesoro: 0/5</div>
<div class="story hidden" id="story"><b id="storyTitle"></b><span id="storyText"></span></div>
  <!-- DEDIC: personalización por URL/localStorage + editor flotante (¿?para=…&de=…) -->
  <script src="dedic.js"></script>
  <script src="script.js"></script>
</body>
</html>
